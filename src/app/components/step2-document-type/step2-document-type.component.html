<div class="document-type-container">
  <h2>Select Document Type</h2>

  <div class="step2-layout">

    <!-- Details panel: dropdown + document info -->
    <div class="details-panel">
      <div class="form-group">
        <label for="documentType">Document Type:</label>
        <div class="select-wrapper">
          <select
            id="documentType"
            class="document-type-select"
            (change)="onDocumentTypeChange($event)"
            [value]="selectedDocumentType?.id"
          >
            <option *ngFor="let docType of documentTypes"
                    [value]="docType.id"
                    [selected]="selectedDocumentType?.id === docType.id">
              {{ docType.name }} ({{ docType.widthMm }}x{{ docType.heightMm }}mm)
            </option>
          </select>
          <i class="material-icons">arrow_drop_down</i>
        </div>
      </div>

      <div *ngIf="selectedDocumentType" class="document-details">
        <h3>Document Details</h3>
        <p><strong>Name:</strong> {{ selectedDocumentType.name }}</p>
        <p><strong>Dimensions:</strong> {{ selectedDocumentType.widthMm }} × {{ selectedDocumentType.heightMm }} mm</p>
      </div>
    </div>

    <!-- Preview panel: cropped photo -->
    <div class="preview-panel">
      <!-- Loading spinner -->
      <div *ngIf="previewLoading" class="preview-placeholder">
        <div class="spinner"></div>
      </div>

      <!-- Cropped photo preview -->
      <ng-container *ngIf="!previewLoading">
        <img *ngIf="previewUrl"
             [src]="previewUrl"
             alt="Document photo preview"
             class="preview-image">
        <div *ngIf="!previewUrl" class="preview-placeholder">
          <span>No photo</span>
        </div>
      </ng-container>

      <!-- Dimension label under preview -->
      <p *ngIf="selectedDocumentType && !previewLoading" class="preview-label">
        {{ selectedDocumentType.widthMm }} × {{ selectedDocumentType.heightMm }} mm
      </p>
    </div>

  </div>
</div>
