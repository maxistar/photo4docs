<div class="upload-container">
  <!-- Hidden file input -->
  <input
    type="file"
    id="fileInput"
    accept="image/*"
    (change)="onFileSelected($event)"
    style="display: none;"
  >

  <!-- Upload button -->
  <button
    type="button"
    class="upload-button"
    (click)="triggerFileInput()"
    [disabled]="status === 'running'"
  >
    <i class="material-icons">image</i>
    <span>{{ status === 'running' ? 'Analysing…' : 'Select Image' }}</span>
  </button>

  <!-- Selected file name -->
  <div *ngIf="fileName" class="file-info">
    Selected: {{ fileName }}
  </div>

  <!-- Processing indicator -->
  <div *ngIf="status === 'running'" class="status-indicator status-running">
    <div class="spinner"></div>
    <span>Analysing photo — detecting face &amp; removing background…</span>
  </div>

  <!-- Success indicator with rotation info and face count -->
  <div *ngIf="status === 'done'" class="status-indicator status-success">
    <i class="material-icons">check_circle</i>
    <span>
      {{ rotationInfo }}
      <ng-container *ngIf="alignedFaceLandmarks && alignedFaceLandmarks.faceCount > 1">
        &nbsp;<span class="warning-badge">{{ alignedFaceLandmarks.faceCount }} faces found — using the largest</span>
      </ng-container>
    </span>
  </div>

  <!-- Error message -->
  <div *ngIf="status === 'error' && errorMessage" class="status-indicator status-error">
    <i class="material-icons">error</i>
    <span>{{ errorMessage }}</span>
  </div>

  <!-- Image preview with overlay canvas -->
  <div *ngIf="displayImage" class="image-preview">
    <img
      #previewImg
      [src]="displayImage"
      alt="Preview"
      (load)="onPreviewLoaded()"
    >
    <canvas
      #previewCanvas
      class="preview-canvas"
    ></canvas>
  </div>

  <!-- Controls (only shown after done) -->
  <div *ngIf="status === 'done'" class="controls-panel">
    <div class="controls-row">
      <label class="checkbox-label">
        <input
          type="checkbox"
          [checked]="!useOriginalBackground"
          (change)="onBgToggle()"
        >
        Remove background
      </label>
    </div>
    <div class="controls-row marks-row">
      <span class="controls-label">Show marks:</span>
      <label class="checkbox-label">
        <input type="checkbox" [checked]="showHeadBox" (change)="showHeadBox = !showHeadBox; onMarkToggle()">
        Head box
      </label>
      <label class="checkbox-label">
        <input type="checkbox" [checked]="showFaceBox" (change)="showFaceBox = !showFaceBox; onMarkToggle()">
        Face box
      </label>
      <label class="checkbox-label">
        <input type="checkbox" [checked]="showEyeLine" (change)="showEyeLine = !showEyeLine; onMarkToggle()">
        Eye line
      </label>
      <label class="checkbox-label">
        <input type="checkbox" [checked]="showChin" (change)="showChin = !showChin; onMarkToggle()">
        Chin
      </label>
      <label class="checkbox-label">
        <input type="checkbox" [checked]="showBrowCenter" (change)="showBrowCenter = !showBrowCenter; onMarkToggle()">
        Brow centre
      </label>
    </div>
  </div>
</div>
